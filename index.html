<!DOCTYPE html>
<html lang="es" data-rendidor-gate="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>Rendiciones Salud</title>
<style>
  :root{--bg:#ffffff;--txt:#141414;--mut:#8b8b8b;--line:#e3e3e3;--bad:#c0392b}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt)}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;
       -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  form{width:100%;max-width:340px}
  h1{font-size:20px;font-weight:600;letter-spacing:-.3px;margin:0 0 4px}
  p{color:var(--mut);margin:0 0 20px}
  label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
  .fila{display:flex;gap:8px}
  input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
        background:#fff;color:var(--txt);outline:none}
  input:focus{border-color:var(--txt)}
  button{font:inherit;font-weight:600;padding:10px 16px;border:1px solid var(--txt);border-radius:8px;
         background:var(--txt);color:#fff;cursor:pointer}
  button:disabled{opacity:.5;cursor:wait}
  .err{min-height:20px;margin-top:10px;font-size:13px;color:var(--bad)}
</style>
</head>
<body>
<form id="gate" autocomplete="off">
  <h1>Rendiciones Salud</h1>
  <p>Contenido privado. Ingresa la clave para ver el tablero.</p>
  <label for="clave">Clave</label>
  <div class="fila">
    <input type="password" id="clave" autocomplete="current-password" autofocus required>
    <button type="submit" id="entrar">Entrar</button>
  </div>
  <div class="err" id="err" role="alert"></div>
</form>
